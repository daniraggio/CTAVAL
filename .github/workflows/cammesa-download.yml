name: Descargar Resumen Precios Previstos (CAMMESA)

on:
  schedule:
    # 09:00 hora Argentina (UTC-3) = 12:00 UTC, todos los días
    - cron: '0 12 * * *'
  workflow_dispatch: {}   # permite disparo manual desde la pestaña Actions

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Crear carpeta de destino
        run: mkdir -p data/cammesa

      - name: Descargar archivo
        run: |
          STAMP=$(date -u +'%Y-%m-%d')
          URL="https://microfe.cammesa.com/static-content/CammesaWeb/download-manager-files/Res400-25/Resumen%20precios%20previstos.xlsx"

          curl -sL -f "$URL" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -o "data/cammesa/resumen_precios_previstos.xlsx"

          echo "STAMP=${STAMP}" >> "$GITHUB_ENV"

      - name: Subir como artifact de la corrida
        uses: actions/upload-artifact@v4
        with:
          name: resumen-precios-previstos-${{ env.STAMP }}
          path: data/cammesa/resumen_precios_previstos.xlsx
          retention-days: 90

      - name: Commitear al repo si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cammesa/resumen_precios_previstos.xlsx
          if git diff --cached --quiet; then
            echo "Sin cambios en el archivo, no se commitea."
          else
            git commit -m "chore: actualizar resumen precios previstos CAMMESA (${STAMP})"
            git push
          fi
