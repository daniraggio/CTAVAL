name: Actualizar Planillas AVAL

on:
  schedule:
    - cron: '0 11 * * *'   # 8 AM Argentina (UTC-3)
  workflow_dispatch:

jobs:
  descargar-planillas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests
        run: python scripts/descargar_aval.py

      - name: Verificar archivo descargado
        run: |
          echo "=== Archivos en data/ ==="
          ls -lh data/

      - name: Commit y push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add -f data/AVAL_*.xls
          git diff --staged --quiet || git commit -m "🤖 Auto-update planillas AVAL $(date +'%Y-%m-%d')"
          git push

      - name: Enviar resumen por mail
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/send_resumen.py
