name: Actualizar Planillas AVAL

on:
  schedule:
    # Corre todos los días a las 8:00 AM hora Argentina (UTC-3 = 11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch: # También permite correrlo manualmente desde GitHub

jobs:
  descargar-planillas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar Python y dependencias
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: |
          pip install playwright requests pandas xlrd openpyxl
          playwright install chromium

      - name: Ejecutar script de descarga
        run: python scripts/descargar_aval.py

      - name: Commit y push si hay cambios
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add data/
          git diff --staged --quiet || git commit -m "🤖 Auto-update planillas AVAL $(date +'%Y-%m-%d')"
          git push
